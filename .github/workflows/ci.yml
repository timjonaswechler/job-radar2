name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Keep credential checks hermetic and ahead of third-party package installation.
      - name: Agent credential safeguard self-tests
        run: npm run test:agent-credential-safety

      - name: Scan tracked snapshot for agent credentials
        run: npm run check:agent-credentials

      - name: Markdown link checker self-tests
        run: npm run test:markdown-links

      - name: Check internal Markdown links
        run: npm run check:markdown-links

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            ripgrep \
            rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend check
        run: npm run check:frontend

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  desktop-build:
    name: Agent Chat gates + desktop build (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            ripgrep \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Provider-neutral Agent and React behavior is portable. Persistence-backed
      # Chat/session and Tauri application contracts run on supported Unix hosts;
      # native Windows persistence and its contract re-enablement belong to #294.
      - name: Portable Agent gates and supported-host persistence contracts
        run: cargo test --manifest-path src-tauri/Cargo.toml --package agent

      - name: Supported-host Agent Chat Tauri application gates
        if: runner.os != 'Windows'
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --package job-radar
          --test desktop agent::chat_application::

      - name: Portable Agent Chat frontend gates
        run: npm run test:frontend -- src/features/agent-chat/tests

      - name: Tauri desktop bundle
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri -- build

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-bundles-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
