[package]
name = "sources"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
atomic-write-file = "0.3.0"
source-profile-dsl = { path = "../source-profile-dsl" }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.46.8", default-features = false }
source-profile-dsl = { path = "../source-profile-dsl", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
