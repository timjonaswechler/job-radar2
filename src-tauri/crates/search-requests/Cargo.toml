[package]
name = "search-requests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
search-resolution = { path = "../search-resolution" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
