[package]
name = "source-profile-dsl"
version = "0.1.0"
description = "Tauri-free declarative Source Profile DSL and compiler"
authors = ["Tim Jonas Wechler"]
edition = "2021"

[dependencies]
bigdecimal = "0.4"
dom_query = "0.27"
indexmap = { version = "2", features = ["serde"] }
encoding_rs = "0.8"
futures-util = "0.3"
http = "1"
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }

[dev-dependencies]
jsonschema = { version = "0.46.8", default-features = false }
proptest = "1.6"
