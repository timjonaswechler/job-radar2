[package]
name = "search-runs"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
geo = { path = "../geo" }
job-postings = { path = "../job-postings" }
search-requests = { path = "../search-requests" }
search-resolution = { path = "../search-resolution" }
source-engine = { path = "../source-engine" }
sources = { path = "../sources" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "migrate"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
source-engine = { path = "../source-engine", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
