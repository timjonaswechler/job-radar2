[package]
name = "search-resolution"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
geo = { path = "../geo" }
source-engine = { path = "../source-engine" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
url = "2"

[dev-dependencies]
source-engine = { path = "../source-engine", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util", "time"] }
