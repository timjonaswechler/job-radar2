[package]
name = "rust-duplicate-block-finder"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "printing", "parsing"] }
walkdir = "2.5"
